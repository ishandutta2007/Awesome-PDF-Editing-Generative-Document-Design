<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="35%" stop-color="#f97316" />
      <stop offset="70%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="glowRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    /* Keyframe Animations */
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(1deg); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(8px) rotate(-1deg); }
    }
    @keyframes pulseAura {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.08); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes waveGrid {
      0%, 100% { opacity: 0.12; }
      50% { opacity: 0.24; }
    }

    .pill-1 { animation: floatPill1 6s ease-in-out infinite; }
    .pill-2 { animation: floatPill2 7s ease-in-out infinite; }
    .aura-red { animation: pulseAura 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .aura-blue { animation: pulseAura 9s ease-in-out infinite; transform-origin: 1050px 300px; }
    .grid-lines { animation: waveGrid 5s ease-in-out infinite; }
    .pulse-stroke { stroke-dasharray: 8 6; animation: flowLine 15s linear infinite; }

    /* Static Typography & Labels */
    .title-main {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -1px;
    }
    .title-accent {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 46px;
      fill: url(#accentGrad);
      letter-spacing: -1px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #9ca3af;
      letter-spacing: 0.2px;
    }
    .badge-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      fill: #f87171;
    }
    .chip-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13.5px;
      fill: #e5e7eb;
    }
  </style>

  <!-- Background Base Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="none" stroke="#1f2937" stroke-width="2" />

  <!-- Animated Ambient Aura Glows (Backdrop) -->
  <circle cx="200" cy="100" r="180" fill="url(#glowRed)" class="aura-red" filter="url(#subtleGlow)" />
  <circle cx="1050" cy="300" r="220" fill="url(#glowBlue)" class="aura-blue" filter="url(#subtleGlow)" />

  <!-- Vector Grid & Flow Lines (Backdrop) -->
  <g class="grid-lines" stroke="#374151" stroke-width="0.8">
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="500" y1="0" x2="500" y2="420" />
    <line x1="700" y1="0" x2="700" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1100" y1="0" x2="1100" y2="420" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="360" x2="1200" y2="360" />
  </g>

  <!-- Background Animated Curves / Data Flow -->
  <path d="M 50 340 C 250 310, 400 390, 650 320 C 850 260, 1000 370, 1160 300" 
        fill="none" stroke="#ef4444" stroke-opacity="0.3" stroke-width="2.5" class="pulse-stroke" />
  <path d="M 60 370 C 300 330, 480 370, 720 300 C 920 240, 1060 330, 1150 270" 
        fill="none" stroke="#6366f1" stroke-opacity="0.25" stroke-width="2" class="pulse-stroke" />

  <!-- Dynamic Floating Decorative Tech Badges (Sides & Bottom, strictly behind/below text focus) -->
  <g class="pill-1" transform="translate(930, 60)" filter="url(#softShadow)">
    <rect width="180" height="42" rx="21" fill="url(#cardGrad)" stroke="#374151" stroke-width="1.2" />
    <circle cx="24" cy="21" r="7" fill="#ef4444" />
    <text x="44" y="26" class="chip-text">⚡ Typst &amp; WeasyPrint</text>
  </g>

  <g class="pill-2" transform="translate(960, 120)" filter="url(#softShadow)">
    <rect width="160" height="42" rx="21" fill="url(#cardGrad)" stroke="#374151" stroke-width="1.2" />
    <circle cx="24" cy="21" r="7" fill="#3b82f6" />
    <text x="44" y="26" class="chip-text">⚛️ React-PDF</text>
  </g>

  <g class="pill-1" transform="translate(890, 180)" filter="url(#softShadow)">
    <rect width="210" height="42" rx="21" fill="url(#cardGrad)" stroke="#374151" stroke-width="1.2" />
    <circle cx="24" cy="21" r="7" fill="#10b981" />
    <text x="44" y="26" class="chip-text">🛡️ Stirling &amp; Bento Wasm</text>
  </g>

  <!-- Central Foreground Content (Title, Subtitle, Badges) -->
  <g transform="translate(80, 0)">
    <!-- Top Category Pill -->
    <g transform="translate(0, 68)">
      <rect width="260" height="32" rx="16" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1.2" />
      <text x="18" y="21" class="badge-label">✨ OPEN-SOURCE &amp; SAAS ECOSYSTEM</text>
    </g>

    <!-- Main Title Lines -->
    <g transform="translate(0, 145)">
      <text x="0" y="0" class="title-main">Awesome PDF Editing &amp;</text>
      <text x="0" y="54" class="title-accent">Generative Document Design</text>
    </g>

    <!-- Subtitle Line -->
    <text x="0" y="240" class="subtitle-text">
      Declarative Layouts, Typesetting Compilers, React-to-PDF &amp; Sovereign Web PDF Studios
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 285)">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <rect width="130" height="38" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1" />
        <text x="16" y="24" class="chip-text">📑 PDF Editors</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(142, 0)">
        <rect width="180" height="38" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1" />
        <text x="16" y="24" class="chip-text">🦀 Typst &amp; Compilers</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(334, 0)">
        <rect width="165" height="38" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1" />
        <text x="16" y="24" class="chip-text">🌐 HTML/CSS-to-PDF</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(511, 0)">
        <rect width="155" height="38" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1" />
        <text x="16" y="24" class="chip-text">🔒 Privacy &amp; Wasm</text>
      </g>
    </g>
  </g>
</svg>
